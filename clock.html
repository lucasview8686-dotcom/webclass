<!DOCTYPE html>
<html>
<body>

<canvas id="canvas" width="600" height="600" style="background-color:rgb(7, 0, 100)">
Sorry, your browser does not support canvas.
</canvas>

<br>
<button onclick="isFixedTime = false; drawClock();">Live time</button>
<button onclick="isFixedTime = true; drawClock();">10:08:37</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let radius = canvas.height / 2;
ctx.translate(radius, radius);
radius = radius * 0.90;

let isFixedTime = false;

drawClock();
setInterval(drawClock, 1000);

function getDisplayTime() {
  if (isFixedTime) {
    return { hour: 10, minute: 8, second: 37 };
  }
  const now = new Date();
  return {
    hour: now.getHours(),
    minute: now.getMinutes(),
    second: now.getSeconds()
  };
}

function drawClock() {
  const time = getDisplayTime();
  drawFace(ctx, radius);
  drawTicks(ctx, radius);
  drawNumbers(ctx, radius);
  drawDigitalTime(ctx, radius, time);
  drawTime(ctx, radius, time);
  // 修正 1：移除原本多餘且未定義變數的 drawHand(ctx,pos,length,width,color);
}

function drawFace(ctx, radius) {
  const grad = ctx.createRadialGradient(0,0,radius*0.95, 0,0,radius*1.05);
  grad.addColorStop(0, '#333');
  grad.addColorStop(0.5, 'gold');
  grad.addColorStop(1, '#333');
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, 2*Math.PI);
  ctx.fillStyle = 'blue';
  ctx.fill();
  ctx.strokeStyle = grad;
  ctx.lineWidth = radius*0.1;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, radius*0.1, 0, 2*Math.PI);
  ctx.fillStyle = '#333';
  ctx.fill();
}

function drawTicks(ctx, radius) {
  for (let i = 0; i < 60; i++) {
    const ang = (i * Math.PI) / 30;
    const isHour = i % 5 === 0;
    ctx.save();
    ctx.rotate(ang);
    ctx.beginPath();

    if (isHour) {
      ctx.lineWidth = radius * 0.025;
      ctx.strokeStyle = 'gold'; // 配合藍色底色，改用金色較清晰
      ctx.moveTo(0, -radius * 0.92);
      ctx.lineTo(0, -radius * 0.82);
    } else {
      ctx.lineWidth = radius * 0.01;
      ctx.strokeStyle = 'white'; // 配合藍色底色，改用白色較清晰
      ctx.moveTo(0, -radius * 0.92);
      ctx.lineTo(0, -radius * 0.87);
    }

    ctx.stroke();
    ctx.restore();
  }
}

function drawNumbers(ctx, radius) {
  ctx.font = radius*0.15 + "px arial";
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";
  ctx.fillStyle = 'white';

  const romanTable = {
      3: "III",
      6: "VI",
      9: "IX",
      12: "XII"
  };

  for(let num = 3; num <= 12; num += 3){
    let ang = num * Math.PI / 6;
    ctx.rotate(ang);
    // 修正 3：維持 0.72 避免與外圈刻度重疊
    ctx.translate(0, -radius*0.72);
    ctx.rotate(-ang);
    ctx.fillText(romanTable[num], 0, 0);
    ctx.rotate(ang);
    ctx.translate(0, radius*0.72);
    ctx.rotate(-ang);
  }
}

function drawDigitalTime(ctx, radius, time) {
  // 修正 2：改用傳入的 time.hour / time.minute / time.second
  const h = String(time.hour).padStart(2, '0');
  const m = String(time.minute).padStart(2, '0');
  const s = String(time.second).padStart(2, '0');
  const timeString = `${h}:${m}:${s}`;

  ctx.save();
  ctx.font = `bold ${radius * 0.12}px monospace`; // 補上字體大小設定
  ctx.fillStyle = 'white';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(timeString, 0, radius * 0.38);
  ctx.restore();
}

function drawTime(ctx, radius, time){
    let {hour, minute, second} = time;
    hour = hour % 12;
    hour = (hour * Math.PI / 6) +
           (minute * Math.PI / (6 * 60)) +
           (second * Math.PI / (360 * 60));
    drawHand(ctx, hour, radius * 0.5, radius * 0.07, 'gold');

    minute = (minute * Math.PI / 30) + (second * Math.PI / (30 * 60));
    drawHand(ctx, minute, radius * 0.75, radius * 0.07, 'silver');

    second = (second * Math.PI / 30);
    drawHand(ctx, second, radius * 0.85, radius * 0.02, 'crimson');
}

function drawHand(ctx, pos, length, width, color) {
    ctx.beginPath();
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.strokeStyle = color;
    ctx.moveTo(0, 0);
    ctx.rotate(pos);
    ctx.lineTo(0, -length);
    ctx.stroke();
    ctx.rotate(-pos);
}
</script>

</body>
</html>
